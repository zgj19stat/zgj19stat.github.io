# Site identity
locale: "en-US"
title: "Guojun Zhu | Personal Homepage"
title_separator: "-"
name: "Guojun Zhu"
description: "Ph.D. student in Statistics at the University of Chinese Academy of Sciences"
url: "https://zgj19stat.github.io"
baseurl: ""
repository: "zgj19stat/zgj19stat.github.io"

# Sidebar profile
author:
  avatar: "profile.png"
  name: "Guojun Zhu (祝国隽)"
  pronouns: "he/him"
  bio: "Ph.D. student in Statistics at the University of Chinese Academy of Sciences"
  location: "China, Beijing"
  employer: "UCAS"
  uri: "https://zgj19stat.github.io/"
  email: "zgj19stat@gmail.com"
  googlescholar: "https://scholar.google.com/citations?user=xZA5QYMAAAAJ"
  orcid: "https://orcid.org/0009-0004-3743-5937"
  github: "zgj19stat"

# Current site behavior
breadcrumbs: false
atom_feed:
  hide: true

# Only the hand-maintained pages and their linked files are published.
include:
  - _pages
  - files
exclude:
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - node_modules
  - vendor

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

# Markdown
markdown: kramdown
highlighter: rouge
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
timezone: Asia/Shanghai

plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from
